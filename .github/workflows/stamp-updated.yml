name: Stamp site updated date

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "js/build-info.js"

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write js/build-info.js from latest commit date
        run: |
          DATE=$(git log -1 --format=%cd --date=format:'%d %b %Y')
          SHA=$(git rev-parse --short HEAD)
          printf '%s\n' \
            'window.KakoHub = window.KakoHub || {};' \
            '/* Auto-stamped on GitHub push by .github/workflows/stamp-updated.yml */' \
            'KakoHub.build = {' \
            "  updated: \"${DATE}\"," \
            "  sha: \"${SHA}\"" \
            '};' > js/build-info.js
          echo "Stamped: ${DATE} (${SHA})"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/build-info.js
          if git diff --staged --quiet; then
            echo "No date change"
          else
            git commit -m "chore: stamp site updated date [skip ci]"
            git push
          fi
